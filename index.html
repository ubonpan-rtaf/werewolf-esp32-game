<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEREWOLF ONLINE - Ultimate Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Prompt', sans-serif;
            background: radial-gradient(circle at center, #1b1b2f 0%, #08080c 100%);
            color: #f1f2f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            background: rgba(25, 25, 38, 0.8);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 40px 28px;
            border-radius: 28px;
            width: min(100%, 480px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        .logo-icon { font-size: 50px; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        h2 { font-size: 28px; font-weight: 800; margin-bottom: 8px; color: #ff6b81; }
        p { font-size: 15px; color: #a4b0be; margin-bottom: 24px; line-height: 1.6; }
        input[type="text"] {
            width: 100%; padding: 16px 20px;
            background: rgba(12, 12, 16, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; color: #fff; font-size: 17px;
            font-family: 'Prompt', sans-serif; outline: none; margin-bottom: 20px;
        }
        input[type="text"]:focus { border-color: #ff4757; box-shadow: 0 0 25px rgba(255, 71, 87, 0.4); }
        .btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            color: white; border: none; border-radius: 16px;
            font-size: 18px; font-weight: 700; font-family: 'Prompt', sans-serif;
            cursor: pointer; box-shadow: 0 8px 25px rgba(255, 71, 87, 0.45); transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); opacity: 0.95; }
        .status-badge {
            display: inline-block; padding: 8px 20px;
            background: rgba(46, 213, 115, 0.15); color: #2ed573;
            border-radius: 20px; font-size: 15px; font-weight: 600; margin-bottom: 20px;
            border: 1px solid rgba(46, 213, 115, 0.3);
        }
        .role-card {
            background: rgba(12, 12, 16, 0.95);
            border-radius: 22px; padding: 30px 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .role-title { font-size: 13px; color: #ffa502; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .role-name { font-size: 36px; font-weight: 900; margin-bottom: 14px; }
        .timer-box { font-size: 14px; color: #ff4757; font-weight: 700; margin-top: 15px; }
        .target-btn {
            display: block; width: 100%; padding: 12px; margin: 8px 0;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            color: white; border-radius: 12px; cursor: pointer; font-family: 'Prompt';
        }
        .target-btn:hover { background: rgba(255,71,87,0.3); border-color: #ff4757; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="game-container">
        <!-- หน้า Lobby -->
        <div id="lobby-screen">
            <div class="logo-icon">🐺</div>
            <h2>หมู่บ้านหมาป่า</h2>
            <p>กรอกชื่อหรือฉายาของคุณเพื่อเข้าร่วมสมรภูมิ</p>
            <input type="text" id="player-name" placeholder="ชื่อของคุณ..." autocomplete="off">
            <button class="btn" onclick="joinGame()">เข้าร่วมวงสนทนา</button>
        </div>
        
        <!-- หน้าจอรอ -->
        <div id="waiting-screen" style="display:none;">
            <div class="logo-icon">⏳</div>
            <h2>เตรียมพร้อมรับคำสั่ง</h2>
            <div class="status-badge">ผู้เล่น: <span id="display-name" style="color:#fff;"></span></div>
            <p style="margin-top: 15px;">เข้าสู่ห้องสำเร็จแล้ว!<br>กำลังรอ Game Master กดเริ่มเกม...</p>
        </div>

        <!-- หน้าจอแสดงบทบาท & เฟสเกม -->
        <div id="game-screen" style="display:none;">
            <div class="role-card" id="role-card-bg">
                <div class="role-title" id="phase-indicator">สถานะ: เตรียมตัว</div>
                <div class="role-name" id="my-role">กำลังโหลด...</div>
                <p id="role-desc" style="color: #dfe4ea; font-size: 15px; line-height: 1.6;">กำลังเชื่อมต่อเข้าสู่รอบเกม...</p>
                <div id="action-area" style="margin-top: 20px;"></div>
            </div>
            <div class="timer-box" id="phase-timer">ระบบพร้อมทำงาน</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCwgLaNKEBORncza75PO4IrGxTrF8vKoQw",
            authDomain: "werewolf-esp32-game.firebaseapp.com",
            projectId: "werewolf-esp32-game",
            storageBucket: "werewolf-esp32-game.firebasestorage.app",
            messagingSenderId: "768089473466",
            appId: "1:768089473466:web:b9196bc05fa83144c39d83",
            databaseURL: "https://werewolf-esp32-game-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myPlayerId = localStorage.getItem("werewolf_player_id") || "player_" + Date.now();
        localStorage.setItem("werewolf_player_id", myPlayerId);
        let hasJoined = false;
        let myRole = "villager";

        // ระบบเสียงเอฟเฟกต์สังเคราะห์ (Web Audio API - เสียงกดปุ่มและเสียงแจ้งเตือน)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if (type === 'click') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'alert') {
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.setValueAtTime(500, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function joinGame() {
            playSound('click');
            const nameInput = document.getElementById("player-name").value.trim();
            if (nameInput === "") { alert("กรุณาใส่ชื่อของคุณก่อนครับ!"); return; }

            db.ref("werewolf_game/players/" + myPlayerId).set({
                name: nameInput, role: "waiting", isAlive: true
            }).then(() => {
                hasJoined = true;
                document.getElementById("lobby-screen").style.display = "none";
                document.getElementById("waiting-screen").style.display = "block";
                document.getElementById("display-name").innerText = nameInput;
            });
        }

        // ดักฟังสถานะเกมหลัก
        db.ref("werewolf_game/system/gameState").on("value", (snapshot) => {
            const state = snapshot.val();
            if (!hasJoined) return;
            playSound('alert');

            document.getElementById("lobby-screen").style.display = "none";
            document.getElementById("waiting-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "block";

            const phaseIndicator = document.getElementById("phase-indicator");
            const roleElement = document.getElementById("my-role");
            const descElement = document.getElementById("role-desc");
            const actionArea = document.getElementById("action-area");
            actionArea.innerHTML = "";

            // ดึงบทบาทของตัวเองมาก่อน
            db.ref("werewolf_game/players/" + myPlayerId).once("value", (pSnap) => {
                if (pSnap.exists()) {
                    myRole = pSnap.val().role || "villager";
                    const isAlive = pSnap.val().isAlive !== false;

                    if (!isAlive) {
                        phaseIndicator.innerText = "สถานะ: ถูกกำจัดแล้ว";
                        roleElement.innerHTML = "👻 วิญญาณผู้ล่วงลับ";
                        roleElement.style.color = "#a4b0be";
                        descElement.innerText = "คุณเสียชีวิตแล้ว ทำได้เพียงชมนิทานรอบวงในฐานะผู้ชม";
                        return;
                    }

                    if (state === "role_reveal") {
                        phaseIndicator.innerText = "เฟส: แจกบทบาท";
                        if (myRole === "wolf") {
                            roleElement.innerHTML = "🐺 หมาป่า";
                            roleElement.style.color = "#ff4757";
                            descElement.innerText = "คุณคือหมาป่า ซ่อนตัวให้เนียน แล้วเตรียมล่าเหยื่อในยามค่ำคืน";
                        } else {
                            roleElement.innerHTML = "🧑 ชาวบ้าน";
                            roleElement.style.color = "#2ed573";
                            descElement.innerText = "คุณคือชาวบ้านผู้บริสุทธิ์ ร่วมมือกับเพื่อนเพื่อหาตัวหมาป่า";
                        }
                    } else if (state === "night_phase") {
                        phaseIndicator.innerText = "🌙 เฟสกลางคืน (NIGHT)";
                        if (myRole === "wolf") {
                            roleElement.innerHTML = "🐺 เวลาล่าของหมาป่า";
                            roleElement.style.color = "#ff4757";
                            descElement.innerText = "เลือกเหยื่อที่คุณต้องการกำจัดคืนนี้:";
                            loadTargets(actionArea);
                        } else {
                            roleElement.innerHTML = "💤 หมู่บ้านหลับใหล";
                            roleElement.style.color = "#3498db";
                            descElement.innerText = "ทุกคนกำลังนอนหลับ โปรดรอความเงียบงันยามวิกาล...";
                        }
                    } else if (state === "day_phase") {
                        phaseIndicator.innerText = "☀️ เฟสกลางวัน (DAY)";
                        roleElement.innerHTML = "🗣️ ช่วงอภิปราย";
                        roleElement.style.color = "#ffa502";
                        descElement.innerText = "ตื่นรับแสงตะวัน! ร่วมกันพูดคุยและจับพิรุธคนที่น่าสงสัยในวง";
                    } else if (state === "voting_phase") {
                        phaseIndicator.innerText = "⚖️ เฟสโหวตประหาร";
                        roleElement.innerHTML = "🗳️ ลงคะแนนเสียง";
                        roleElement.style.color = "#e74c3c";
                        descElement.innerText = "โหวตเลือกผู้ต้องสงสัยเพื่อขับไล่ออกจากหมู่บ้าน:";
                        loadTargets(actionArea, "vote");
                    }
                }
            });
        });

        // โหลดรายชื่อผู้เล่นเพื่อทำการเลือกเป้าหมาย (ฆ่า หรือ โหวต)
        function loadTargets(container, mode = "kill") {
            db.ref("werewolf_game/players").once("value", (snapshot) => {
                snapshot.forEach((child) => {
                    const pId = child.key;
                    const pData = child.val();
                    if (pId !== myPlayerId && pData.isAlive) {
                        const btn = document.createElement("button");
                        btn.className = "target-btn";
                        btn.innerText = (mode === "kill" ? "🎯 ล่าเหยื่อ: " : "⚖️ โหวตประหาร: ") + pData.name;
                        btn.onclick = () => {
                            playSound('click');
                            alert("คุณเลือก " + pData.name + " เรียบร้อยแล้ว!");
                        };
                        container.appendChild(btn);
                    }
                });
            });
        }
    </script>
</body>
</html>
