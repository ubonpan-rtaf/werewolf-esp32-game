<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEREWOLF ONLINE - Official Game Client</title>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Prompt', sans-serif;
            background: radial-gradient(circle at center, #1b1b2f 0%, #08080c 100%);
            color: #f1f2f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        .game-container {
            background: rgba(25, 25, 38, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 45px 30px;
            border-radius: 28px;
            width: min(100%, 480px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .logo-icon {
            font-size: 50px;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        h2 {
            font-size: clamp(26px, 5vw, 32px);
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff6b81 0%, #ff4757 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }
        p {
            font-size: clamp(14px, 3vw, 16px);
            color: #a4b0be;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .input-group {
            margin-bottom: 24px;
        }
        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: rgba(12, 12, 16, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #fff;
            font-size: 17px;
            font-family: 'Prompt', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #ff4757;
            box-shadow: 0 0 25px rgba(255, 71, 87, 0.4);
            background: rgba(12, 12, 16, 0.95);
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Prompt', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 71, 87, 0.45);
        }
        .btn:hover {
            opacity: 0.95;
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 71, 87, 0.65);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(46, 213, 115, 0.3);
        }
        .pulse {
            animation: pulse 1.8s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .role-card {
            background: rgba(12, 12, 16, 0.95);
            border-radius: 22px;
            padding: 35px 25px;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.7);
            animation: zoomIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .role-title {
            font-size: 13px;
            color: #ffa502;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 12px;
        }
        .role-name {
            font-size: clamp(34px, 8vw, 44px);
            font-weight: 900;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .role-desc {
            font-size: clamp(14px, 3.5vw, 16px);
            color: #dfe4ea;
            line-height: 1.7;
        }
    </style>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="game-container">
        <!-- Lobby Screen -->
        <div id="lobby-screen">
            <div class="logo-icon">🐺</div>
            <h2>หมู่บ้านหมาป่า</h2>
            <p>กรอกชื่อหรือฉายาของคุณเพื่อเตรียมตัวเข้าสู่สมรภูมิเกมลับสมอง</p>
            <div class="input-group">
                <input type="text" id="player-name" placeholder="ชื่อของคุณ..." autocomplete="off">
            </div>
            <button class="btn" onclick="joinGame()">เข้าร่วมวงสนทนา</button>
        </div>
        
        <!-- Waiting Screen -->
        <div id="waiting-screen" style="display:none;">
            <div class="logo-icon">⏳</div>
            <h2>เตรียมพร้อมรับคำสั่ง</h2>
            <div class="status-badge">ผู้เล่น: <span id="display-name" style="color:#fff;"></span></div>
            <p class="pulse" style="margin-top: 15px;">เข้าสู่ห้องสำเร็จแล้ว!<br>กำลังรอ Game Master (ESP32) ออกคำสั่งเริ่มเกม...</p>
        </div>

        <!-- Role Screen -->
        <div id="role-screen" style="display:none;">
            <div class="role-card" id="role-card-bg">
                <div class="role-title">บทบาทลับเฉพาะของคุณ</div>
                <div class="role-name" id="my-role">กำลังโหลด...</div>
                <p class="role-desc" id="role-desc">ตั้งใจฟังคำสั่งจาก Game Master ให้ดี ชัยชนะอยู่ในมือคุณ!</p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCwgLaNKEBORncza75PO4IrGxTrF8vKoQw",
            authDomain: "werewolf-esp32-game.firebaseapp.com",
            projectId: "werewolf-esp32-game",
            storageBucket: "werewolf-esp32-game.firebasestorage.app",
            messagingSenderId: "768089473466",
            appId: "1:768089473466:web:b9196bc05fa83144c39d83",
            databaseURL: "https://werewolf-esp32-game-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myPlayerId = localStorage.getItem("werewolf_player_id") || "player_" + Date.now();
        localStorage.setItem("werewolf_player_id", myPlayerId);

        let hasJoined = false;

        function joinGame() {
            const nameInput = document.getElementById("player-name").value.trim();
            if (nameInput === "") {
                alert("กรุณาใส่ชื่อของคุณก่อนเข้าร่วมครับ!");
                return;
            }

            db.ref("werewolf_game/players/" + myPlayerId).set({
                name: nameInput,
                role: "waiting",
                isAlive: true
            }).then(() => {
                hasJoined = true;
                document.getElementById("lobby-screen").style.display = "none";
                document.getElementById("waiting-screen").style.display = "block";
                document.getElementById("display-name").innerText = nameInput;
            });
        }

        db.ref("werewolf_game/system/gameState").on("value", (snapshot) => {
            const state = snapshot.val();
            if (!hasJoined) return;

            if (state === "role_reveal") {
                document.getElementById("lobby-screen").style.display = "none";
                document.getElementById("waiting-screen").style.display = "none";
                document.getElementById("role-screen").style.display = "block";
                
                db.ref("werewolf_game/players/" + myPlayerId + "/role").once("value", (roleSnap) => {
                    const role = roleSnap.val();
                    const roleElement = document.getElementById("my-role");
                    const descElement = document.getElementById("role-desc");
                    const cardBg = document.getElementById("role-card-bg");

                    if (role === "wolf") {
                        roleElement.innerHTML = "🐺 หมาป่า";
                        roleElement.style.color = "#ff4757";
                        descElement.innerText = "คุณคือหมาป่า! ซ่อนตัวเนียนไปกับชาวบ้าน แล้วออกล่าเหยื่อในยามวิกาลอย่างเงียบเชียบ";
                        cardBg.style.borderColor = "rgba(255, 71, 87, 0.4)";
                    } else {
                        roleElement.innerHTML = "🧑 ชาวบ้าน";
                        roleElement.style.color = "#2ed573";
                        descElement.innerText = "คุณคือชาวบ้านผู้บริสุทธิ์ ใช้สัญชาตญาณและหลักฐานร่วมมือกับเพื่อนเพื่อกระชากหน้ากากหมาป่าให้ได้";
                        cardBg.style.borderColor = "rgba(46, 213, 115, 0.4)";
                    }
                });
            }
        });
    </script>
</body>
</html>
