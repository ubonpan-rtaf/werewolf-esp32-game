<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werewolf Game - Master Control</title>
    <!-- โหลดฟอนต์ Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Prompt', sans-serif;
            background: radial-gradient(circle at center, #1e1e2f 0%, #0b0b0f 100%);
            color: #f1f2f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .game-container {
            background: rgba(30, 30, 45, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 40px 28px;
            border-radius: 24px;
            /* ปรับขนาดให้ยืดหยุ่นอัตโนมัติ: มือถือเต็มตา, คอมพิวเตอร์กว้างกำลังดี */
            width: min(100%, 460px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        h2 {
            font-size: clamp(24px, 5vw, 30px);
            font-weight: 700;
            margin-bottom: 10px;
            color: #ff6b81;
            letter-spacing: 0.5px;
        }
        p {
            font-size: clamp(14px, 3vw, 16px);
            color: #a4b0be;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .input-group {
            margin-bottom: 24px;
        }
        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: rgba(15, 15, 20, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            color: #fff;
            font-size: 16px;
            font-family: 'Prompt', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #ff4757;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.35);
            background: rgba(15, 15, 20, 0.95);
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            font-family: 'Prompt', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 25px rgba(255, 71, 87, 0.4);
        }
        .btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 71, 87, 0.6);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .status-badge {
            display: inline-block;
            padding: 8px 18px;
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
            border: 1px solid rgba(46, 213, 115, 0.25);
        }
        .pulse {
            animation: pulse 1.8s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .role-card {
            background: rgba(15, 15, 20, 0.9);
            border-radius: 20px;
            padding: 32px 24px;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
        }
        .role-title {
            font-size: 14px;
            color: #ffa502;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .role-name {
            font-size: clamp(32px, 7vw, 42px);
            font-weight: 700;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
        }
        .role-desc {
            font-size: clamp(14px, 3.5vw, 16px);
            color: #dfe4ea;
            line-height: 1.7;
        }
    </style>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="game-container">
        <!-- Lobby Screen -->
        <div id="lobby-screen">
            <h2>🐺 หมู่บ้านหมาป่า</h2>
            <p>กรุณากรอกชื่อของคุณเพื่อเข้าร่วมวงสนทนา</p>
            <div class="input-group">
                <input type="text" id="player-name" placeholder="ชื่อเล่น หรือ ฉายา..." autocomplete="off">
            </div>
            <button class="btn" onclick="joinGame()">เข้าร่วมวง</button>
        </div>
        
        <!-- Waiting Screen -->
        <div id="waiting-screen" style="display:none;">
            <h2>ยินดีต้อนรับ</h2>
            <div class="status-badge">ผู้เล่น: <span id="display-name" style="color:#fff;"></span></div>
            <p class="pulse" style="margin-top: 12px;">⏳ เข้าร่วมสำเร็จแล้ว<br>กำลังรอ Game Master กดเริ่มเกม...</p>
        </div>

        <!-- Role Screen -->
        <div id="role-screen" style="display:none;">
            <div class="role-card" id="role-card-bg">
                <div class="role-title">บทบาทของคุณในรอบนี้</div>
                <div class="role-name" id="my-role">กำลังโหลด...</div>
                <p class="role-desc" id="role-desc">ตั้งใจฟังคำสั่งจาก Game Master ให้ดีล่ะ!</p>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCwgLaNKEBORncza75PO4IrGxTrF8vKoQw",
            authDomain: "werewolf-esp32-game.firebaseapp.com",
            projectId: "werewolf-esp32-game",
            storageBucket: "werewolf-esp32-game.firebasestorage.app",
            messagingSenderId: "768089473466",
            appId: "1:768089473466:web:b9196bc05fa83144c39d83",
            databaseURL: "https://werewolf-esp32-game-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myPlayerId = localStorage.getItem("werewolf_player_id") || "player_" + Date.now();
        localStorage.setItem("werewolf_player_id", myPlayerId);

        let hasJoined = false;

        function joinGame() {
            const nameInput = document.getElementById("player-name").value.trim();
            if (nameInput === "") {
                alert("กรุณาใส่ชื่อของคุณด้วยครับ!");
                return;
            }

            db.ref("werewolf_game/players/" + myPlayerId).set({
                name: nameInput,
                role: "waiting",
                isAlive: true
            }).then(() => {
                hasJoined = true;
                document.getElementById("lobby-screen").style.display = "none";
                document.getElementById("waiting-screen").style.display = "block";
                document.getElementById("display-name").innerText = nameInput;
            });
        }

        db.ref("werewolf_game/system/gameState").on("value", (snapshot) => {
            const state = snapshot.val();
            if (!hasJoined) return;

            if (state === "role_reveal") {
                document.getElementById("lobby-screen").style.display = "none";
                document.getElementById("waiting-screen").style.display = "none";
                document.getElementById("role-screen").style.display = "block";
                
                db.ref("werewolf_game/players/" + myPlayerId + "/role").once("value", (roleSnap) => {
                    const role = roleSnap.val();
                    const roleElement = document.getElementById("my-role");
                    const descElement = document.getElementById("role-desc");
                    const cardBg = document.getElementById("role-card-bg");

                    if (role === "wolf") {
                        roleElement.innerHTML = "🐺 หมาป่า";
                        roleElement.style.color = "#ff4757";
                        descElement.innerText = "คุณคือหมาป่า! คอยหาจังหวะจัดการชาวบ้านในยามค่ำคืนอย่างแนบเนียน";
                        cardBg.style.borderColor = "rgba(255, 71, 87, 0.4)";
                    } else {
                        roleElement.innerHTML = "🧑 ชาวบ้าน";
                        roleElement.style.color = "#2ed573";
                        descElement.innerText = "คุณคือชาวบ้านผู้บริสุทธิ์ ร่วมมือกับทุกคนเพื่อหาตัวหมาป่าให้เจอ";
                        cardBg.style.borderColor = "rgba(46, 213, 115, 0.4)";
                    }
                });
            }
        });
    </script>
</body>
</html>
